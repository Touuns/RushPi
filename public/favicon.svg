<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rush Pi">
  <defs>
    <!-- Same three brand colours and stops as the Home screen's .home__logo
         radial-gradient orb (src/styles/global.css): gold -> orange -> violet. -->
    <radialGradient id="orb" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="55%" stop-color="#ff7a3d" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#orb)" />
  <!-- Same glyph, weight and colour as the in-game player orb (createPlayer()
       in src/game/scenes/MainScene.ts): a white serif "pi". -->
  <text x="32" y="43" font-family="Georgia, 'Times New Roman', serif" font-size="34"
        font-weight="bold" fill="#ffffff" text-anchor="middle">&#960;</text>
</svg>
